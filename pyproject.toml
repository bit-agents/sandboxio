[project]
name = "sandboxio"
description = "One secure Python API for running AI-agent code in any sandbox."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DOCS"]
authors = [{ name = "sandboxio contributors" }]
keywords = ["sandbox", "agents", "llm", "docker", "e2b", "isolation", "security"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
    "Typing :: Typed",
]
dynamic = ["version"]

# Core stays at these two. Any further base dependency needs an ADR (ADR-0004).
dependencies = ["anyio>=4.0", "typing-extensions>=4.12"]

[project.urls]
Homepage = "https://github.com/bit-agents/sandboxio"
Repository = "https://github.com/bit-agents/sandboxio"
Issues = "https://github.com/bit-agents/sandboxio/issues"
Documentation = "https://docs.sandboxio.dev"
Changelog = "https://github.com/bit-agents/sandboxio/blob/main/CHANGELOG.md"

# Each first-party adapter is its own distribution in packages/, exactly like a third-party
# `sandboxio-<name>`; the extra pulls it in. e2b and modal land with their adapters.
# The floor keeps the extra off the 0.0.0 name-reservation releases; the adapter carries the
# upper bound on the core, because that is the pairing a third-party adapter also declares.
[project.optional-dependencies]
docker = ["sandboxio-docker>=0.1"]
e2b = ["sandboxio-e2b>=0.1"]
# Spans need only the API; the host application brings the SDK and exporters (ADR-0011).
otel = ["opentelemetry-api>=1.30"]
# Integrations (spec/09). Each bound is the oldest version the weekly framework matrix
# actually runs the tests against — not a guess. Raising one needs a matrix leg to prove it.
langgraph = ["langchain-core>=0.3"]
openai-agents = ["openai-agents>=0.19"]
mcp = ["mcp>=2.0"]

[dependency-groups]
# Only needed to build or serve the site (ADR-0029). MkDocs 2.0 drops the plugin
# system outright, so the major stays pinned.
docs = [
    "mkdocs<2",
    "mkdocs-material>=9.5",
    "mkdocs-redirects>=1.2",
]
# Coverage is its own group, so the everyday `uv run pytest` loop stays uninstrumented.
# `coverage run -m pytest`, not pytest-cov: this package ships a pytest11 entry point, so
# pytest imports sandboxio while loading plugins — before pytest-cov starts measuring, which
# reads every module-level line as a miss (61% against the real 76%).
cov = [
    "coverage[toml]>=7.16.1",
]
dev = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
    "pyyaml>=6.0",
    "ruff>=0.14",
    "mypy>=1.14",
    "pyright>=1.1.390",
    "types-PyYAML>=6.0",
    "types-docker>=7.1",
]

# `sandboxio` is the documented command; `sbx` is a local alias only (ADR-0014).
[project.scripts]
sandboxio = "sandboxio.cli:main"
sbx = "sandboxio.cli:main"

[project.entry-points."sandboxio.backends"]
fake = "sandboxio.testing.fake:FakeBackend"

[project.entry-points.pytest11]
sandboxio = "sandboxio.testing.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sandboxio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sandboxio"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "examples/", "scripts/", "mkdocs.yml", "README.md", "CHANGELOG.md", "LICENSE", "LICENSE-DOCS"]

[tool.uv]
required-version = ">=0.5"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sandboxio-docker = { workspace = true }
sandboxio-e2b = { workspace = true }

[tool.pytest.ini_options]
minversion = "8.0"
# examples/test_my_tool.py is a user-facing example and a real test; it runs as both.
testpaths = ["tests", "examples"]
# No -q here: a wrapper adding its own -q makes -qq, which drops the "N passed" line.
addopts = "--strict-markers --strict-config --disable-socket --allow-unix-socket -m 'not docker and not e2b'"
markers = [
    "wheel: builds a wheel; needs `uv` on PATH",
    "docs: builds the docs site; needs `uv sync --group docs`",
    "docker: needs a working Docker daemon",
    "e2b: needs E2B_API_KEY and network; `uv run --env-file .env pytest -m e2b`",
]
# Provider tests are opt-in: `uv run pytest -m docker`, `uv run --env-file .env pytest -m e2b`.

filterwarnings = [
    "error",
    # docker-py leaves response sockets to the GC; scoped to its socket so nothing else hides.
    "ignore:unclosed <socket.socket.*docker.sock:ResourceWarning",
    "ignore:.*docker.sock.*:pytest.PytestUnraisableExceptionWarning",
    # Same hygiene, but finalised after the session ends, where it exits non-zero with every
    # test already green. The filter above never matched it: the message names urllib3, not
    # the socket. Narrow to that one finaliser so a response we leak still surfaces.
    "ignore:Exception ignored while finalizing file <urllib3\\.response\\.HTTPResponse:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
# Every distribution that ships, first-party adapters included — a wheel's code is covered
# or it is not, regardless of which package it lives in.
source = [
    "src/sandboxio",
    "packages/sandboxio-docker/src/sandboxio_docker",
    "packages/sandboxio-e2b/src/sandboxio_e2b",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Lines that cannot run under the default selection, or cannot run at all.
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "@(typing\\.)?overload",
    "raise NotImplementedError",
]
# The floor the badge claims, enforced on every pull request. Raise it when the real number
# has stayed above the next step for a while; never lower it to make a red run green.
fail_under = 80

[tool.ruff]
line-length = 96
src = ["src", "tests", "scripts", "packages/*/src"]
# Markdown stays out: the spec aligns comments in its samples on purpose.
extend-exclude = ["*.md"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "A",                # no builtin shadowing (ADR-0017)
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "TID",              # tidy imports
    "RUF",
    "ANN",              # annotations — the public surface is the product
    "TC",               # type-checking-only imports stay out of the import budget
    "PTH",
    "RET",
    "C4",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["TC"]

[tool.ruff.lint.flake8-bugbear]
# Frozen value objects are safe as defaults; the spec writes them this way.
extend-immutable-calls = ["sandboxio.models.Resources", "sandboxio.models.NetworkPolicy", "Resources", "NetworkPolicy"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts", "packages", "examples"]
strict = true
warn_unreachable = true
disallow_any_explicit = false
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code", "possibly-undefined"]

[[tool.mypy.overrides]]
# e2b-code-interpreter ships no py.typed marker.
module = ["e2b_code_interpreter", "e2b_code_interpreter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# examples/05 wires sandboxio into frameworks it does not depend on, so they are not
# installed here. The example still has to type-check as the reader will write it.
module = ["langgraph.*", "langchain_anthropic.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests", "scripts", "packages", "examples"]
# The LangGraph example imports packages sandboxio does not depend on, so strict mode sees
# only Unknown there. mypy still checks the file (ignore_missing_imports above).
exclude = ["examples/05_langgraph_agent.py"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
