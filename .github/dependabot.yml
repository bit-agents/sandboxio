version: 2
updates:
  # Actions run with id-token: write in release.yml; a stale pinned SHA is a supply-chain
  # risk that only a bot will notice (ADR-0012, hazards F1).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      # One PR a week, not one per action: the whole set is reviewed and pinned together.
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      dev-dependencies:
        dependency-type: development
