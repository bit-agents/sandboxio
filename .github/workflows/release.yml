name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false  # the publishing path does not restore a cache it did not build
      # Hatch reads each version from its own __init__.py, so the tag reaches the artefacts
      # through nothing but this check — and a wrong version on PyPI can never be reused.
      - name: tag matches every package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for f in src/sandboxio/__init__.py packages/*/src/*/__init__.py; do
            got=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' "$f")
            [ "$got" = "$want" ] || {
              echo "::error file=$f::version $got does not match tag $GITHUB_REF_NAME"
              exit 1
            }
          done
      - run: uv build --all-packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  # The live suite for the only cloud backend v0.1 ships. It lived in ci.yml behind a tag
  # trigger, where it ran beside the release instead of in front of it. Unlike the nightly
  # copy, a missing credential fails: a release must not pass by not testing.
  e2b:
    name: e2b contract suite
    runs-on: ubuntu-latest
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false  # this job holds E2B_API_KEY; it restores no cache
      - run: uv sync --all-extras
      - name: the credential is part of the gate
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo "::error::E2B_API_KEY is not set; the release cannot prove the e2b adapter works"
            exit 1
          fi
      - run: uv run pytest -m e2b -p no:cacheprovider

  publish:
    needs: [build, e2b]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # PyPI Trusted Publishing + PEP 740 attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      # No API token anywhere: publishing from a laptop is never the path (runbook).
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true

  # The MCP server image the Docker MCP Catalog entry points at (docker/mcp/server.yaml).
  # It builds from source, not from PyPI, but it runs after `publish` so a release that was
  # rejected at the environment gate leaves no image behind.
  image:
    needs: publish
    name: MCP image to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Anything but digits and dots in the version is a pre-release, and `latest` in the
      # catalog must never resolve to one.
      - id: kind
        run: |
          case "${GITHUB_REF_NAME#v}" in
            *[!0-9.]*) echo "final=false" >> "$GITHUB_OUTPUT" ;;
            *)         echo "final=true"  >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/sandboxio-mcp
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.kind.outputs.final == 'true' }}
      # arm64 is not optional: Docker Desktop on Apple silicon is where this image is run.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/sandboxio-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
