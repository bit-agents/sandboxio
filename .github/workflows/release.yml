name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false  # the publishing path does not restore a cache it did not build
      # Hatch reads each version from its own __init__.py, so the tag reaches the artefacts
      # through nothing but this check — and a wrong version on PyPI can never be reused.
      - name: tag matches every package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for f in src/sandboxio/__init__.py packages/*/src/*/__init__.py; do
            got=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' "$f")
            [ "$got" = "$want" ] || {
              echo "::error file=$f::version $got does not match tag $GITHUB_REF_NAME"
              exit 1
            }
          done
      - run: uv build --all-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  # The live suite for the only cloud backend v0.1 ships. It lived in ci.yml behind a tag
  # trigger, where it ran beside the release instead of in front of it. Unlike the nightly
  # copy, a missing credential fails: a release must not pass by not testing.
  e2b:
    name: e2b contract suite
    runs-on: ubuntu-latest
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false  # this job holds E2B_API_KEY; it restores no cache
      - run: uv sync --all-extras
      - name: the credential is part of the gate
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo "::error::E2B_API_KEY is not set; the release cannot prove the e2b adapter works"
            exit 1
          fi
      - run: uv run pytest -m e2b -p no:cacheprovider

  publish:
    needs: [build, e2b]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # PyPI Trusted Publishing + PEP 740 attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      # No API token anywhere: publishing from a laptop is never the path (runbook).
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true

  # The MCP server image the Docker MCP Catalog entry points at (docker/mcp/server.yaml).
  # It builds from source, not from PyPI, but it runs after `publish` so a release that was
  # rejected at the environment gate leaves no image behind.
  image:
    needs: publish
    name: MCP image to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The tags are PEP 440, not semver — `0.1.0rc3` has no hyphen, so metadata-action's
      # `type=semver` parses nothing and emits no tag at all. Derive both values here, the
      # same way the version gate does. Anything but digits and dots is a pre-release, and
      # `latest` in the catalog must never resolve to one.
      - id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in
            *[!0-9.]*) echo "final=false" >> "$GITHUB_OUTPUT" ;;
            *)         echo "final=true"  >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/sandboxio-mcp
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.final == 'true' }}
      # arm64 is not optional: Docker Desktop on Apple silicon is where this image is run.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/sandboxio-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The only step of this chain a human sees. It runs last: a release that failed to push
  # its image is not announced.
  announce:
    needs: [publish, image]
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      # One step, so nothing interpolates a step output into a shell (zizmor
      # template-injection). A pre-release has no changelog section of its own.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {p=1; next} p && /^## \[/ {exit} p
          ' CHANGELOG.md > notes.md
          args=(--title "$GITHUB_REF_NAME")
          if [ -s notes.md ]; then args+=(--notes-file notes.md); else args+=(--generate-notes); fi
          # PEP 440 again, as in `image`: anything but digits and dots is a pre-release.
          case "$v" in *[!0-9.]*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
