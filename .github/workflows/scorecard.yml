# OpenSSF Scorecard: the supply-chain posture of this repository, scored by someone else's
# rules and published. It reports; it gates nothing, so it never runs on a pull request —
# a fork's PR could not write the results anyway.
name: Scorecard

on:
  # Scorecard's Branch-Protection check reads settings, so a settings change rescores.
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 2"  # weekly, Tuesday
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the findings to the Security tab.
      security-events: write
      # publish_results: the OIDC token is what proves the run came from this repository.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: run the analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the public OpenSSF dataset, which is what the README badge reads.
          # The repository is public and the score is derived from public metadata only.
          publish_results: true

      # The SARIF that produced the score, kept for the weeks between runs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: results.sarif
