# OpenSSF Scorecard: the supply-chain posture of this repository, scored by someone else's
# rules and published. It reports; it gates nothing, so it never runs on a pull request —
# a fork's PR could not write the results anyway.
name: Scorecard

on:
  # Scorecard's Branch-Protection check reads settings, so a settings change rescores.
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 2"  # weekly, Tuesday
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the findings to the Security tab.
      security-events: write
      # publish_results: the OIDC token is what proves the run came from this repository.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the public OpenSSF dataset, which is what the README badge reads.
          # The repository is public and the score is derived from public metadata only.
          publish_results: true

      # The SARIF that produced the score, kept for the weeks between runs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: results.sarif
