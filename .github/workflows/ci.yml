name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # nightly: cloud contract suites and the latest-SDK canary

# The `cache-poisoning` ignores below: this workflow publishes nothing, so there is no
# runtime artifact to poison. The tag trigger exists only to gate the e2b suite before a
# release, and that job is the one with a credential — so it restores no cache at all.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  # Runs the four hard gates as well: import budget, no sockets at import,
  # wheel contents, doc samples and doc links are all pytest tests.
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0  # zizmor: ignore[cache-poisoning]
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0  # zizmor: ignore[cache-poisoning]
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv lock --check

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0  # zizmor: ignore[cache-poisoning]
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run mypy
      - run: uv run pyright

  docker:
    name: docker contract suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0  # zizmor: ignore[cache-poisoning]
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: docker pull python:3.12-slim
      - run: uv run pytest -m docker -p no:cacheprovider
      - name: zero leaked containers
        run: |
          leaked=$(docker ps -aq --filter label=io.sandboxio.managed | wc -l)
          echo "sandboxio containers remaining: $leaked"
          test "$leaked" -eq 0

  # The floor lives in pyproject (`fail_under`), not here, so `make coverage` and CI agree.
  # Both selections run: the default one plus the Docker suite, because the adapters are
  # shipped code and the default selection deselects their contract suites. The E2B adapter
  # is the known hole — its suite is nightly and needs a credential, so it scores low here.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0  # zizmor: ignore[cache-poisoning]
        with:
          enable-cache: true
      - run: uv sync --all-extras --group cov
      - run: docker pull python:3.12-slim
      # `coverage run -m pytest`, never pytest-cov: the pytest11 entry point imports
      # sandboxio before pytest-cov would start measuring (see pyproject).
      - run: uv run coverage run -m pytest
      - run: uv run coverage run --append -m pytest -m docker -p no:cacheprovider
      - name: report, and fail under the floor
        run: |
          status=0
          uv run coverage report > coverage.txt || status=$?
          {
            echo '### Coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        shell: bash
      - name: the browsable report
        if: always()
        run: uv run coverage html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

  e2b:
    name: e2b contract suite (nightly + release)
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false  # this job holds E2B_API_KEY; it restores no cache
      - run: uv sync --all-extras
      - name: run, or explain the skip
        run: |
          if [ -z "$E2B_API_KEY" ]; then echo "E2B_API_KEY secret not set; skipping"; exit 0; fi
          uv run pytest -m e2b -p no:cacheprovider

  # The churn early-warning system (spec/08 CI matrix). Unpinned on purpose: the lockfile is
  # what CI defends, and this is what warns us the defence is about to break. Cloud adapters
  # only — framework churn is the weekly matrix, and Modal lands in v0.1.1.
  canary:
    name: latest-SDK canary
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
      - run: uv sync --all-extras
      - name: upgrade every provider SDK past the lockfile
        run: uv pip install --upgrade e2b e2b-code-interpreter
      - name: record what that resolved to
        run: uv pip list | grep -Ei '^e2b' | tee sdk-versions.txt
      - name: SDK surface, and everything else that needs no credential
        run: uv run --no-sync pytest -p no:cacheprovider
      - name: e2b contract suite, when the secret exists
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo "::notice::E2B_API_KEY is not set; the live e2b suite did not run"
            exit 0
          fi
          uv run --no-sync pytest -m e2b -p no:cacheprovider
        shell: bash
      # Rule 1 of the runbook procedure is that this issue exists; a red run nobody sees is
      # the failure mode the churn log is supposed to prevent.
      - name: open or update the provider-churn issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "provider-churn: the nightly latest-SDK canary is red"
          RUNBOOK: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/runbook.md#provider-churn-response
        run: |
          versions=$(cat sdk-versions.txt 2>/dev/null || echo "not recorded — the run failed before resolving")
          body=$(printf '%s\n\n**Run:** %s\n\n**Resolved SDK versions:**\n\n```\n%s\n```\n\nTriage per [the runbook](%s).' \
            "The nightly canary installs every provider SDK unpinned. It failed, so an upstream release has most likely broken an adapter." \
            "$RUN_URL" "$versions" "$RUNBOOK")
          existing=$(gh issue list --label provider-churn --state open --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --label provider-churn --body "$body"
          fi
        shell: bash

  # CONTRIBUTING.md requires a DCO sign-off on every commit; until now only prose said so.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: every commit carries Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::no DCO sign-off: $sha $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD")
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s --amend' and force-push (CONTRIBUTING.md)."
            exit 1
          fi
          echo "every commit in this pull request is signed off"
        shell: bash

  # CONTRIBUTING.md requires Conventional Commits subjects; until now only prose said so.
  # Hand-rolled like the DCO gate: one regex does not justify a Node toolchain.
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TYPES: build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: every commit subject is a Conventional Commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s\n' "$subject" | grep -qE "^($TYPES)(\([^)]+\))?!?: .+"; then
              echo "::error::not a Conventional Commit subject: $sha $subject"
              bad=1
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD")
          if [ "$bad" -ne 0 ]; then
            echo "Subjects look like 'fix(docker): reap the container on a failed start'."
            echo "Types: ${TYPES//|/, }. Breaking changes append '!' before the colon."
            exit 1
          fi
          echo "every commit subject in this pull request is a Conventional Commit"
        shell: bash

      # Squash merge puts the title on main, not the subjects the step above checked.
      - name: the pull request title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$TITLE" | grep -qE "^($TYPES)(\([^)]+\))?!?: .+"; then
            echo "::error::not a Conventional Commit title: $TITLE"
            echo "Types: ${TYPES//|/, }. Breaking changes append '!' before the colon."
            exit 1
          fi
          echo "the pull request title is a Conventional Commit"
        shell: bash

  # zizmor pinned like every action here: a new release adding audits must not turn an
  # unrelated pull request red.
  actions:
    name: actions security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false
      - run: uvx zizmor@1.30.1 --offline .github/workflows/
