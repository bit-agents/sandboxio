name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # nightly: cloud contract suites and the latest-SDK canary

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  # Runs the four hard gates as well: import budget, no sockets at import,
  # wheel contents, doc samples and doc links are all pytest tests.
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv lock --check

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run mypy
      - run: uv run pyright

  docker:
    name: docker contract suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: docker pull python:3.12-slim
      - run: uv run pytest -m docker -p no:cacheprovider
      - name: zero leaked containers
        run: |
          leaked=$(docker ps -aq --filter label=io.sandboxio.managed | wc -l)
          echo "sandboxio containers remaining: $leaked"
          test "$leaked" -eq 0

  e2b:
    name: e2b contract suite (nightly + release)
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: run, or explain the skip
        run: |
          if [ -z "$E2B_API_KEY" ]; then echo "E2B_API_KEY secret not set; skipping"; exit 0; fi
          uv run pytest -m e2b -p no:cacheprovider

  # CONTRIBUTING.md requires a DCO sign-off on every commit; until now only prose said so.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: every commit carries Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::no DCO sign-off: $sha $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD")
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s --amend' and force-push (CONTRIBUTING.md)."
            exit 1
          fi
          echo "every commit in this pull request is signed off"
        shell: bash
