# Docker MCP Catalog entry (docker/mcp-registry `servers/sandboxio/server.yaml`).
name: sandboxio
image: ghcr.io/bit-agents/sandboxio-mcp
type: server
meta:
  category: developer-tools
  tags:
    - sandbox
    - code-execution
    - agents
    - security
about:
  title: sandboxio
  description: >-
    Give your assistant somewhere to run code that is not your machine. Python and shell
    execute in an isolated sandbox with no network by default, a fixed time limit and
    stable error codes; files persist under /work for the session. The backend, the egress
    policy and the timeout are fixed at startup — no tool changes them, and nothing ever
    runs on the host. One run_python tool instead of many narrow ones. Backed by E2B
    microVMs in this image.
  icon: https://raw.githubusercontent.com/bit-agents/sandboxio/main/docs/assets/icon.png
source:
  project: https://github.com/bit-agents/sandboxio
  dockerfile: docker/mcp/Dockerfile
config:
  description: Pick the backend template and supply the E2B credential.
  secrets:
    - name: sandboxio.e2b_api_key
      env: E2B_API_KEY
      example: e2b_xxxxxxxxxxxxxxxxxxxxxxxx
  env:
    - name: SBX_DEBUG
      example: "0"
      value: "{{sandboxio.debug}}"
  parameters:
    type: object
    properties:
      debug:
        type: string
        default: "0"
run:
  command:
    - --backend
    - e2b://code-interpreter-v1
