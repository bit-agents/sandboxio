# Docker MCP Catalog entry (docker/mcp-registry `servers/sandboxio/server.yaml`).
# TODO(placeholder): {{ORG}} is the GitHub org/user once the repo home is chosen (ADR-0014).
name: sandboxio
image: ghcr.io/{{ORG}}/sandboxio-mcp
type: server
meta:
  category: developer-tools
  tags:
    - sandbox
    - code-execution
    - agents
    - security
about:
  title: sandboxio
  description: >-
    Run Python and shell commands in an isolated sandbox with no network by default, a
    fixed time limit and stable error codes. One run_python tool instead of many narrow
    ones; files persist under /work for the session. Backed by E2B microVMs in this image.
  icon: https://raw.githubusercontent.com/{{ORG}}/sandboxio/main/docs/assets/icon.png
source:
  project: https://github.com/{{ORG}}/sandboxio
  dockerfile: docker/mcp/Dockerfile
config:
  description: Pick the backend template and supply the E2B credential.
  secrets:
    - name: sandboxio.e2b_api_key
      env: E2B_API_KEY
      example: e2b_xxxxxxxxxxxxxxxxxxxxxxxx
  env:
    - name: SBX_DEBUG
      example: "0"
      value: "{{sandboxio.debug}}"
  parameters:
    type: object
    properties:
      debug:
        type: string
        default: "0"
run:
  command:
    - --backend
    - e2b://code-interpreter-v1
