[project]
name = "sandboxio-e2b"
description = "E2B adapter for sandboxio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = ["sandboxio", "e2b-code-interpreter>=2.0"]

[project.entry-points."sandboxio.backends"]
e2b = "sandboxio_e2b:E2BBackend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sandboxio_e2b/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sandboxio_e2b"]

[tool.uv.sources]
sandboxio = { workspace = true }
